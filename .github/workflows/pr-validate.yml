name: 'PR: Validate Plan & Patch'

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  validate-pr:
    runs-on: debian-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check PR body for required sections
        uses: actions/github-script@v6
        with:
          script: |
            const body = context.payload.pull_request && context.payload.pull_request.body ? context.payload.pull_request.body : '';
            const missing = [];
            if (!/^\s*Plan:/m.test(body)) missing.push('Plan');
            if (!/^\s*Patch:/m.test(body)) missing.push('Patch');
            if (missing.length) {
              core.setFailed(`PR body missing required sections: ${missing.join(', ')}. Please include a 'Plan:' and 'Patch:' section per repository guidelines.`);
            } else {
              core.info('PR body contains required sections: Plan and Patch.');
            }
