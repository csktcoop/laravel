catalog_version: "2.0"

items:

  - id: topoteretes/cognee
    name: cognee
    title: Persistent memory and knowledge graph layer for AI agents
    url: https://github.com/topoteretes/cognee
    adoption: main-list

    tags:
      domain: [ai-agents, agent-engineering, web-development]
      function: [memory, knowledge-graph, retrieval]
      layer: [agent-runtime, knowledge, data]
      interface: [library, api]
      runtime: [python, local, server]
      resource: [server-required]

    use_when:
      - Agents need persistent context across sessions
      - Project decisions, entities, and relationships must be recalled later
      - Vector retrieval alone is insufficient

    avoid_when:
      - The project only needs short-lived task context
      - A simple file-based memory layer is sufficient
      - Operational complexity must remain minimal

    ecosystem:
      layer: agent-runtime
      role: persistent-memory-and-knowledge-graph

    benefit:
      type: architecture
      value: persistent cross-session memory
      quantified:
        - "Hybrid graph and vector retrieval"
        - "add -> cognify -> search lifecycle"
      evidence: repository-description

    ram-4gb: unknown

    combine:
      with: [lightrag, falkordb, graphify, book-to-skill]
      complements: [graphrag, trace-mcp]
      overlaps: [lightrag, graphrag]
      replaces: []
      incompatible_with: []

    decision:
      web_playbook_value: high
      adopt: adopt-partial
      adopt_parts:
        - project-memory lifecycle
        - memory retention policy
        - entity and relationship extraction
        - stale-memory evaluation
      benchmark:
        - memory recall accuracy
        - stale-memory rate
        - contradictory-memory rate

  - id: mattpocock/skills
    name: mattpocock-skills
    title: Engineering skills for AI coding agents
    url: https://github.com/mattpocock/skills
    adoption: main-list

    tags:
      domain: [web-development, ai-agents, agent-engineering]
      function: [agent-skills, architecture, code-understanding]
      layer: [agent-runtime, developer-workflow]
      interface: [skills]
      runtime: [local]
      resource: [ram-4gb]

    use_when:
      - Building a reusable engineering playbook
      - Separating planning, implementation, testing, and debugging behaviors
      - Replacing one large system prompt with composable skills

    avoid_when:
      - A single-purpose automation script is enough
      - Skills are being copied without adapting them to the project

    ecosystem:
      layer: agent-runtime
      role: composable-engineering-skill-library

    benefit:
      type: workflow
      value: reusable engineering procedures
      quantified:
        - "Approximately 17 skill files reported in repository walkthroughs"
        - "Large GitHub adoption signal"
      evidence: repository-and-community-description

    ram-4gb: verified
    ram-4gb_scope: skill-instruction-execution
    ram-4gb_note: >
      The skills themselves are lightweight; model memory and agent host
      requirements remain separate.

    combine:
      with: [graphify, trace-mcp, hallmark, system-design-primer, rtk, caveman]
      complements: [cognee, book-to-skill, openwork]
      overlaps: [hallmark, book-to-skill]
      replaces: []
      incompatible_with: []

    decision:
      web_playbook_value: very-high
      adopt: adopt-full
      adopt_parts:
        - skill granularity
        - skill naming
        - frontmatter structure
        - planning and debugging workflows
        - review and handoff patterns
      benchmark:
        - first-attempt acceptance-test pass rate
        - regression count
        - unreviewed destructive actions

